services:
  # 1. MongoDB Document Store (Official Image with persistent volume)
  mongodb:
    image: mongo:7.0
    container_name: airpulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - airpulse_mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=apix_mospi
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. AirPulse FastAPI Calculation Engine & Scraper Scheduler
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: airpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=apix_mospi
      - USE_MONGODB=True
      - PORT=8000
      - HOST=0.0.0.0
      - SCHEDULER_INTERVAL_MINUTES=30
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. AirPulse React 19 Production Frontend (Served via Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend/my-react-app
      dockerfile: Dockerfile
    container_name: airpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  airpulse_mongo_data:
    driver: local

