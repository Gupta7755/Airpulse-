services:
  - type: web
    name: airpulse-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Secrets: set these in the Render dashboard (sync: false keeps them out of the repo)
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: apix_mospi
      - key: USE_MONGODB
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "30"
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: OPENSKY_CLIENT_ID_2
        sync: false
      - key: OPENSKY_CLIENT_SECRET_2
        sync: false
      - key: API_AUTH_PASS
        sync: false

  - type: web
    name: airpulse-web
    runtime: static
    plan: free
    rootDir: frontend/my-react-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: airpulse-api
          envVarKey: RENDER_EXTERNAL_URL

